<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proyecto Módulo 4</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <div class="container my-5 text-center">
        <h2>Proyecto Práctico - Módulo 4</h2>
        <button type="button" id="btnAbrirModal" class="btn btn-primary btn-lg mt-4" data-toggle="modal" data-target="#miModal">
            Abrir Modal Interactivo
        </button>
    </div>

    <div class="modal fade" id="miModal" tabindex="-1" role="dialog" aria-labelledby="miModalLabel" aria-hidden="true">
        <div class="modal-dialog" role="document">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="miModalLabel">Modal con Eventos de jQuery</h5>
                    <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                        <span aria-hidden="true">&times;</span>
                    </button>
                </div>
                <div class="modal-body">
                    Revisa la consola del navegador para ver el registro de todos los eventos del modal.
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-dismiss="modal">Cerrar</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.min.js"></script>

    <script>
        $('#miModal').on('show.bs.modal', function () {
            console.log('El modal ha comenzado a abrirse (show)');
            $('#btnAbrirModal').prop('disabled', true).removeClass('btn-primary').addClass('btn-warning');
        });

        $('#miModal').on('shown.bs.modal', function () {
            console.log('El modal se terminó de abrir completamente (shown)');
        });

        $('#miModal').on('hide.bs.modal', function () {
            console.log('El modal ha comenzado a ocultarse (hide)');
        });

        $('#miModal').on('hidden.bs.modal', function () {
            console.log('El modal se terminó de ocultar completamente (hidden)');
            $('#btnAbrirModal').prop('disabled', false).removeClass('btn-warning').addClass('btn-primary');
        });
    </script>
</body>
</html>
